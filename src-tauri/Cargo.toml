[package]
name = "klaudio-panels"
version = "1.17.0"
description = "Klaudio Panels — native window embedding the Claude Code CLI"
authors = ["willywg"]
edition = "2021"

[lib]
name = "klaudio_panels_lib"
# Desktop only needs rlib; cdylib overflows the 65,535 PE export ordinal
# limit under the Windows GNU linker (ld).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
which = "7"
dirs = "6"
anyhow = "1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
portable-pty = "0.9.0"
base64 = "0.22.1"
notify = "8"
notify-debouncer-full = "0.6"
ignore = "0.4"
lru = "0.14"
git2 = { version = "0.20", default-features = false }
tauri-plugin-deep-link = "2.4.7"
url = "2.5.8"

[target.'cfg(target_os = "windows")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-single-instance = { version = "2.4.0", features = ["deep-link"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSDictionary"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSBitmapImageRep"] }
