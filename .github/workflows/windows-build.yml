# Builds the Windows NSIS installer and attaches it to a published release.
#
# Same shape as linux-build.yml, for the same reasons: nobody on the team
# runs Windows daily, cross-compiling a Tauri app from macOS is impractical,
# and hanging off `release: published` means the release always exists to
# upload into (the macOS DMG and the tag are pushed by hand first, see
# docs/release-flow.md).
#
# Toolchain: MSVC, the runner's default, not the GNU target the port was
# first validated on (#127). `build.rs` already embeds the application
# manifest for both (`/MANIFEST:EMBED` on MSVC, `windres` on GNU), and on MSVC
# Tauri links the WebView2 loader statically. That means no mingw or windres
# to install here, and no `WebView2Loader.dll` that has to travel next to
# the executable. The installer bootstraps the WebView2 runtime if a machine
# lacks it.
#
# The installer is unsigned, so SmartScreen will warn on first run, and it is
# named `-untested` on purpose. Windows is "validation in progress" in the
# README: it builds and Gianmarco ran it end to end, but not on a clean
# machine, and nobody has run this CI-built installer yet. Drop the suffix
# once a clean-machine install has been checked.
name: Windows build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the installer to (e.g. v1.17.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - run: bun tauri build --bundles nsis

      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          out=$(mktemp -d)
          for f in src-tauri/target/release/bundle/nsis/*.exe; do
            base=$(basename "$f")
            cp "$f" "$out/${base%.*}-untested.${base##*.}"
          done
          built=("$out"/*)
          if [ ${#built[@]} -eq 0 ]; then
            echo "::error::no Windows installer was produced" >&2
            exit 1
          fi
          printf '%s\n' "${built[@]}"
          gh release upload "$TAG" "${built[@]}" --clobber

      - name: Summary
        run: |
          {
            echo "### Windows installer attached"
            echo
            echo "Built on \`windows-latest\` (MSVC), unsigned, **not yet validated on a"
            echo "clean machine**. See [#127](https://github.com/willywg/klaudio-panels/pull/127)."
          } >> "$GITHUB_STEP_SUMMARY"
